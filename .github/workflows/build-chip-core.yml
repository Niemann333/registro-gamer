name: Compilar chip-core (soltune fork)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    container:
      image: emscripten/emsdk:3.1.45

    steps:
      - name: Checkout registro-gamer
        uses: actions/checkout@v4
        with:
          path: registro-gamer

      - name: Clonar soltune/chip-player-js com submodules
        run: |
          apt-get update -q && apt-get install -y -q git cmake autoconf automake
          git clone --recurse-submodules --depth=1 \
            --branch develop \
            https://github.com/soltune/chip-player-js.git chip-player-js

      - name: Instalar Node.js 16 e yarn
        run: |
          curl -fsSL https://deb.nodesource.com/setup_16.x | bash -
          apt-get install -y nodejs
          npm install -g yarn

      - name: Listar estrutura e submodulos
        run: |
          echo "=== Raiz ==="
          ls chip-player-js/
          echo "=== .gitmodules ==="
          cat chip-player-js/.gitmodules 2>/dev/null || echo "sem .gitmodules"
          echo "=== scripts package.json ==="
          node -e "const d=require('./chip-player-js/package.json'); Object.entries(d.scripts||{}).forEach(([k,v])=>console.log(k,':',v))"

      - name: Instalar dependências JS
        run: |
          cd chip-player-js
          yarn install --frozen-lockfile --ignore-scripts

      - name: Compilar libxmp
        run: |
          cd chip-player-js/libxmp
          autoconf
          # Remove .symver incompatível com WASM
          find src -name "*.c" -o -name "*.h" | xargs grep -l "symver" 2>/dev/null | \
            xargs -r sed -i '/symver/d'
          # --host necessário para cross-compilation com Emscripten
          emconfigure ./configure --host=wasm32-unknown-emscripten
          emmake make

      - name: Compilar libvgm
        run: |
          if [ -d "chip-player-js/libvgm" ]; then
            cd chip-player-js/libvgm
            mkdir -p build && cd build
            emcmake cmake ..
            emmake make
          else
            echo "libvgm não encontrado, pulando"
          fi

      - name: Compilar psflib (PSF/PS1)
        run: |
          if [ -d "chip-player-js/psflib" ]; then
            cd chip-player-js/psflib
            emmake make -f Emscripten.Makefile libpsflib.a
          else
            echo "psflib não encontrado, pulando"
          fi

      - name: Compilar lazyusf2 (USF/N64)
        run: |
          if [ -d "chip-player-js/lazyusf2" ]; then
            cd chip-player-js/lazyusf2
            emmake make -f Emscripten.Makefile liblazyusf.a
          else
            echo "lazyusf2 não encontrado, pulando"
          fi

      - name: Compilar webGSF (GSF/GBA)
        run: |
          if [ -d "chip-player-js/webGSF/emscripten" ]; then
            # Patch mGBA: substitui <libc/limits.h> por <limits.h> (removido no Emscripten moderno)
            find chip-player-js/webGSF/mgba -name "*.h" -o -name "*.c" |               xargs grep -l "libc/limits.h" 2>/dev/null |               xargs -r sed -i 's|#include <libc/limits.h>|#include <limits.h>|g'
            cd chip-player-js/webGSF/emscripten
            emmake make -f Emscripten.Makefile
          else
            echo "webGSF não encontrado, pulando"
          fi

      - name: Compilar FluidLite (MIDI)
        run: |
          if [ -d "chip-player-js/fluidlite" ]; then
            mkdir -p chip-player-js/fluidlite/build
            cd chip-player-js/fluidlite/build
            emcmake cmake ..
            emmake make fluidlite-static
          else
            echo "fluidlite não encontrado, pulando"
          fi

      - name: Compilar chip-core.wasm
        run: |
          cd chip-player-js
          python3 -c "
import re, sys
with open('scripts/build-chip-core.js', 'r') as f:
    c = f.read()
c = re.sub(r\"-s BINARYEN_TRAP_MODE='clamp'\", '', c)
with open('scripts/build-chip-core.js', 'w') as f:
    f.write(c)
print('Patch aplicado')
"
          node scripts/build-chip-core.js

      - name: Build do React (JS bundle)
        run: |
          cd chip-player-js
          cp sample.env .env || true
          # Cria config Firebase vazia para o React compilar
          mkdir -p src/config
          echo "export default {};" > src/config/firebaseConfig.js
          yarn build
        env:
          CI: false
          REACT_APP_CATALOG_PREFIX: ""
          REACT_APP_SOUNDFONT_URL_PATH: "/soundfonts/"
          REACT_APP_API_BASE: ""

      - name: Copiar binários para registro-gamer
        run: |
          DEST=registro-gamer/chiptune-player/static/js
          mkdir -p $DEST

          cp chip-player-js/public/chip-core*.wasm \
             registro-gamer/chiptune-player/ 2>/dev/null || \
          cp chip-player-js/build/chip-core*.wasm \
             registro-gamer/chiptune-player/ 2>/dev/null || true

          cp chip-player-js/build/static/js/main.*.js $DEST/ 2>/dev/null || true
          cp chip-player-js/build/static/js/chip-core.*.chunk.js $DEST/ 2>/dev/null || true

          echo "=== Arquivos copiados ==="
          ls -lh registro-gamer/chiptune-player/*.wasm 2>/dev/null || echo "nenhum .wasm"
          ls -lh $DEST/*.js 2>/dev/null | grep -E "main\.|chip-core" || echo "nenhum .js"

      - name: Commit dos binários
        run: |
          cd registro-gamer
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add chiptune-player/static/js/main.*.js \
                  chiptune-player/static/js/chip-core.*.chunk.js \
                  chiptune-player/chip-core*.wasm 2>/dev/null || true
          git diff --staged --quiet && echo "Nada mudou" || \
          git commit -m "build: chip-core.wasm soltune (GSF+PSF+USF)" && git push
