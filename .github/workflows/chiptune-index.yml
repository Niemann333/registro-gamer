name: Gerar índice de Chiptunes
on:
  push:
    paths:
      - 'Chiptunes/**'
      - 'tools/gerar_subfaixas.py'
  workflow_dispatch:
permissions:
  contents: write

# Vários envios seguidos disparam várias execuções ao mesmo tempo; sem isto elas
# brigavam para gravar o mesmo arquivo e o push falhava. Agora rodam uma de cada vez
# e, se chegar um envio novo, a execução antiga é cancelada (a nova já inclui tudo).
concurrency:
  group: chiptune-index
  cancel-in-progress: true

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar chiptunes-index.json
        run: |
          python3 - << 'EOF'
          import os, json
          def scan(path):
              result = []
              try:
                  entries = sorted(os.scandir(path), key=lambda e: (e.is_file(), e.name))
              except:
                  return result
              for entry in entries:
                  if entry.is_dir():
                      result.append({
                          "name": entry.name,
                          "type": "dir",
                          "path": entry.path,
                          "children": scan(entry.path)
                      })
                  else:
                      ext = os.path.splitext(entry.name)[1].lower()
                      if ext in ['.vgm','.vgz','.nsf','.nsfe','.spc','.gym','.ay',
                                 '.gbs','.hes','.kss','.sap','.ahx','.thx','.sid','.mod','.s3m',
                                 '.xm','.it','.mptm','.mid','.midi','.gsf','.minigsf',
                                 '.2sf','.psf','.ssf','.dsf','.usf','.miniusf','.2sf','.mini2sf']:
                          result.append({
                              "name": entry.name,
                              "type": "file",
                              "path": entry.path
                          })
              return result
          os.makedirs("chiptune-player", exist_ok=True)
          index = scan("Chiptunes")
          out = "chiptune-player/chiptunes-index.json"
          with open(out, "w", encoding="utf-8") as f:
              json.dump(index, f, ensure_ascii=False)
          print(f"Índice gerado: {out}")
          EOF
      - name: Gerar subfaixas.json (faixas dentro de NSF, GBS, SID, SAP, KSS)
        run: python3 tools/gerar_subfaixas.py
      - name: Commit do índice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # O índice é gerado a partir das pastas: se o main mudou no meio do caminho,
          # em vez de tentar mesclar o JSON, pega o main novo e gera de novo.
          for tentativa in 1 2 3 4 5; do
            git add chiptune-player/chiptunes-index.json chiptune-player/subfaixas.json
            if git diff --staged --quiet; then echo "Nada mudou"; exit 0; fi
            git commit -q -m "ci: atualiza índice de chiptunes [skip ci]"
            if git push; then exit 0; fi
            echo "O main mudou durante a execução; refazendo ($tentativa)..."
            git fetch -q origin main
            git reset -q --hard origin/main
            python3 - << 'EOF'
          import os, json
          EXT = ['.vgm','.vgz','.nsf','.nsfe','.spc','.gym','.ay','.gbs','.hes','.kss','.sap','.ahx','.thx','.sid',
                 '.mod','.s3m','.xm','.it','.mptm','.mid','.midi','.gsf','.minigsf','.2sf','.psf','.ssf',
                 '.dsf','.usf','.miniusf','.mini2sf']
          def scan(path):
              result = []
              try:
                  entries = sorted(os.scandir(path), key=lambda e: (e.is_file(), e.name))
              except Exception:
                  return result
              for entry in entries:
                  if entry.is_dir():
                      result.append({"name": entry.name, "type": "dir", "path": entry.path, "children": scan(entry.path)})
                  elif os.path.splitext(entry.name)[1].lower() in EXT:
                      result.append({"name": entry.name, "type": "file", "path": entry.path})
              return result
          with open("chiptune-player/chiptunes-index.json", "w", encoding="utf-8") as f:
              json.dump(scan("Chiptunes"), f, ensure_ascii=False)
          EOF
            python3 tools/gerar_subfaixas.py
            sleep $((tentativa * 5))
          done
          echo "Não consegui gravar o índice depois de 5 tentativas"; exit 1
