name: Analisar volume dos chiptunes

# Mede o volume de cada faixa (e de cada subsom de NSF/GBS/KSS/SID) com o próprio
# player do blog, num navegador sem tela, e grava chiptune-player/ganhos.json.
# Roda sozinho quando você envia chiptunes novos; também dá para disparar à mão
# na aba Actions (opção "medir tudo de novo").
on:
  push:
    paths:
      - 'Chiptunes/**'
      - 'tools/medir_volume.py'
  workflow_run:
    workflows: ['Gerar índice de Chiptunes']   # depois que o mapa de subfaixas é atualizado
    types: [completed]
  workflow_dispatch:
    inputs:
      tudo:
        description: 'Medir tudo de novo (não só as faixas novas)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ganhos-chiptune
  cancel-in-progress: false

jobs:
  medir:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Instalar o navegador sem tela
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Medir o volume das faixas novas
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.tudo }}" = "true" ]; then ARGS="--tudo"; fi
          python3 tools/medir_volume.py --jobs 4 $ARGS

      - name: Salvar ganhos.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add chiptune-player/ganhos.json chiptune-player/ganhos-hash.json
          git diff --staged --quiet && echo "Nada mudou" || \
            (git commit -m "ganhos: atualiza o volume dos chiptunes" && git pull --rebase && git push)
