name: Playlists fixas do blog

# Sempre que um arquivo entra, muda ou sai da pasta Playlists/, refaz
# chiptune-player/playlists-fixas.json (o que o blog mostra com o 📌).
on:
  push:
    paths:
      - 'Playlists/**'
      - 'tools/gerar_playlists_fixas.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: playlists-fixas
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Juntar as playlists da pasta Playlists/
        run: python3 tools/gerar_playlists_fixas.py
      - name: Salvar playlists-fixas.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add chiptune-player/playlists-fixas.json
          git diff --staged --quiet && echo "Nada mudou" || \
            (git commit -m "playlists: atualiza as playlists fixas do blog" && git pull --rebase && git push)
