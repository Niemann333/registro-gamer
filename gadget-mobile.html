    // page-chiptune
    var page=document.createElement('div');
    page.className='page';page.id='page-chiptune';
    page.style.cssText='padding:0 0 80px;background:#070d07';
    var browser=document.createElement('div');browser.id='ct-browser';
    page.appendChild(browser);
    var nav=app.querySelector('#nav');
    app.insertBefore(page,nav);

    // ct-nav-sticky (back + crumb + search) dentro de ct-browser
    var sticky=document.createElement('div');sticky.id='ct-nav-sticky';
    var topRow=document.createElement('div');topRow.id='ct-top-row';
    topRow.style.cssText='display:flex;align-items:center;justify-content:space-between;padding:2px 0 4px';
    var back=document.createElement('div');back.id='ct-nav-back';
    back.innerHTML='&#8592; Voltar';
    back.addEventListener('click',function(){ctNavBack();});
    var lw=document.createElement('div');lw.id='ct-loop-wrap';
    var ll=document.createElement('span');ll.id='ct-loop-lbl';ll.textContent='LOOPS:';
    var lm=document.createElement('button');lm.className='ct-lbtn';lm.id='ct-lm';lm.textContent='-';
    var lv=document.createElement('span');lv.id='ct-loop-val';lv.textContent='1';
    var lp=document.createElement('button');lp.className='ct-lbtn';lp.id='ct-lp';lp.textContent='+';
    lw.appendChild(ll);lw.appendChild(lm);lw.appendChild(lv);lw.appendChild(lp);
    lm.addEventListener('click',function(){ctSetLoop(ctLoopCount-1);});
    lp.addEventListener('click',function(){ctSetLoop(ctLoopCount+1);});
    topRow.appendChild(back);topRow.appendChild(lw);
    sticky.appendChild(topRow);
    var crumb=document.createElement('div');crumb.id='ct-crumb';crumb.className='ct-crumb';
    sticky.appendChild(crumb);
    var srch=document.createElement('input');srch.id='ct-search';srch.type='text';
    srch.placeholder='\u266a Buscar m\u00fasica...';srch.autocomplete='off';
    srch.addEventListener('input',function(){
      var q=this.value.trim().toLowerCase();
      if(!q){ctCrumbSaved='';_ctSearchState=false;ctRender();}else{if(!_ctSearchState){_ctSearchState=true;history.pushState({rgChiptune:true},'','');}ctGlobalSearch(q);}
    });
    sticky.appendChild(srch);
    browser.appendChild(sticky);

    // loading + empty + list
    var loading=document.createElement('div');loading.id='ct-loading';
    loading.textContent='CARREGANDO...';loading.style.display='none';
    var empty=document.createElement('div');empty.id='ct-empty';
    empty.innerHTML='<div style="font-size:32px;margin-bottom:8px">&#127926;</div><div>Pasta vazia</div>';
    empty.style.display='none';
    var list=document.createElement('div');list.id='ct-list';
    browser.appendChild(loading);browser.appendChild(empty);browser.appendChild(list);

    // botão chiptune no nav
    var chipSvg='<svg width="20" height="20" viewBox="0 0 36 36"><rect x="10" y="6" width="16" height="24" rx="2" fill="#0d2a0d" stroke="#39ff14" stroke-width="1.2"/><rect x="13" y="10" width="10" height="8" rx="1" fill="#39ff14" opacity=".25"/><line x1="6" y1="11" x2="10" y2="11" stroke="#39ff14" stroke-width="1.2" stroke-linecap="round"/><line x1="6" y1="15" x2="10" y2="15" stroke="#39ff14" stroke-width="1.2" stroke-linecap="round"/><line x1="6" y1="19" x2="10" y2="19" stroke="#39ff14" stroke-width="1.2" stroke-linecap="round"/><line x1="6" y1="23" x2="10" y2="23" stroke="#39ff14" stroke-width="1.2" stroke-linecap="round"/><line x1="30" y1="11" x2="26" y2="11" stroke="#39ff14" stroke-width="1.2" stroke-linecap="round"/><line x1="30" y1="15" x2="26" y2="15" stroke="#39ff14" stroke-width="1.2" stroke-linecap="round"/><line x1="30" y1="19" x2="26" y2="19" stroke="#39ff14" stroke-width="1.2" stroke-linecap="round"/><line x1="30" y1="23" x2="26" y2="23" stroke="#39ff14" stroke-width="1.2" stroke-linecap="round"/><circle cx="14" cy="9" r="1.2" fill="#39ff14" opacity=".7"/></svg>';
    var btn=document.createElement('button');btn.className='nb';btn.id='nb-chiptune';
    btn.innerHTML='<span class="ni" style="display:flex;align-items:center;justify-content:center">'+chipSvg+'</span><span>Chiptune</span><div class="nd"></div>';
    btn.onclick=function(){rgm.goTab('chiptune');};
    var archBtn=nav.querySelector('#nb-archive');
    nav.insertBefore(btn,archBtn);
  })();



  })();
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',_rgmInit);}else{_rgmInit();}
</script>
