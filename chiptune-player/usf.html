<!DOCTYPE html>
<html>
<head><meta charset="utf-8">
<style>body{margin:0;background:#111;color:#aaa;font-family:monospace;font-size:11px;padding:4px;}</style>
</head>
<body>
<div id="status">Inicializando...</div>
<script type="module">
const worker = new Worker(new URL('./usf-worker.js', import.meta.url), {type: 'module'});

let audioCtx, processor, gainNode;
const audioQueue = [];
const QUEUE_TARGET = 8;
let loaded = false;

const params = new URLSearchParams(location.search);
const songUrl = params.get('url');

const setStatus = t => document.getElementById('status').textContent = t;

worker.onerror = e => { console.error('[USF worker error]', e); setStatus('Erro: ' + e.message); };

worker.onmessage = e => {
  const d = e.data;
  if (d.type === 'ready') {
    if (songUrl) worker.postMessage({type: 'load', url: songUrl});
    else { setStatus('Pronto'); try { parent.postMessage({type:'ready'}, '*'); } catch(e) {} }
  }
  if (d.type === 'status') setStatus(d.text);
  if (d.type === 'log') console.log('[USF]', d.text);
  if (d.type === 'loaded') {
    loaded = true;
    setStatus('\u266A ' + d.name);
    setupAudio();
    for (let i = 0; i < QUEUE_TARGET; i++) worker.postMessage({type: 'render'});
    try { parent.postMessage({type:'ready'}, '*'); } catch(e) {}
  }
  if (d.type === 'audio') {
    audioQueue.push(d);
    if (audioQueue.length < QUEUE_TARGET) worker.postMessage({type: 'render'});
    try { parent.postMessage({type:'position', posMs: d.pos, durMs: d.dur}, '*'); } catch(e) {}
  }
  if (d.type === 'error') setStatus('Erro: ' + d.text);
};

function setupAudio() {
  if (audioCtx) return;
  audioCtx = new AudioContext({sampleRate: 44100});
  gainNode = audioCtx.createGain();
  gainNode.gain.value = 1;
  processor = audioCtx.createScriptProcessor(4096, 0, 2);
  processor.onaudioprocess = ev => {
    const L = ev.outputBuffer.getChannelData(0);
    const R = ev.outputBuffer.getChannelData(1);
    if (audioQueue.length > 0) {
      const chunk = audioQueue.shift();
      const len = Math.min(chunk.L.length, L.length);
      L.set(chunk.L.subarray(0, len));
      R.set(chunk.R.subarray(0, len));
      if (audioQueue.length < QUEUE_TARGET) worker.postMessage({type: 'render'});
    } else {
      L.fill(0); R.fill(0);
      if (loaded) worker.postMessage({type: 'render'});
    }
  };
  processor.connect(gainNode);
  gainNode.connect(audioCtx.destination);
}

window.addEventListener('message', e => {
  if (!e.data) return;
  const d = e.data;
  if (d.type === 'play' && d.url) {
    loaded = false; audioQueue.length = 0;
    worker.postMessage({type: 'load', url: d.url});
  }
  if (d.type === 'pause') { try { audioCtx?.suspend(); } catch(e) {} }
  if (d.type === 'resume') { try { audioCtx?.resume(); } catch(e) {} }
  if (d.type === 'volume' && typeof d.level === 'number') {
    if (gainNode) gainNode.gain.value = Math.max(0, d.level);
  }
  if (d.type === 'seek' && typeof d.ms === 'number') worker.postMessage({type: 'seek', ms: d.ms});
});
</script>
</body>
</html>
