<!DOCTYPE html>
<html>
<head><meta charset="utf-8">
<style>body{margin:0;background:#111;color:#aaa;font-family:monospace;font-size:11px;padding:4px;}</style>
</head>
<body>
<div id="status">Inicializando...</div>
<script type="module">
import CHIP_CORE_init from './chip-core.js';

const BS = 2048;
const SR = 33600; // N64 sample rate

let CC, audioCtx, gainNode, processor;
let renderBufPtr = 0;

const params = new URLSearchParams(location.search);
const songUrl = params.get('url');

const setStatus = m => document.getElementById('status').textContent = m;

async function fetchBin(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(r.status);
  return new Uint8Array(await r.arrayBuffer());
}

function findLibTag(data) {
  if (data[0] !== 0x50 || data[1] !== 0x53 || data[2] !== 0x46) return null;
  const rlen = data[4]|(data[5]<<8)|(data[6]<<16)|(data[7]<<24);
  const clen = data[8]|(data[9]<<8)|(data[10]<<16)|(data[11]<<24);
  const ts = 16 + rlen + clen;
  if (ts + 5 >= data.length) return null;
  if (data[ts]!==0x5B||data[ts+1]!==0x54||data[ts+2]!==0x41||data[ts+3]!==0x47||data[ts+4]!==0x5D) return null;
  const tags = new TextDecoder().decode(data.slice(ts+5));
  for (const line of tags.split('\n')) {
    const eq = line.indexOf('=');
    if (eq > 0 && line.slice(0,eq).trim().toLowerCase() === '_lib')
      return line.slice(eq+1).trim();
  }
  return null;
}

function loadUSFData(data, isLib) {
  const ptr = CC.allocate(data, CC.ALLOC_NORMAL);
  CC._n64_load_file(ptr, data.length, isLib ? 1 : 0, 0);
  // Note: memory is intentionally not freed as N64 may need it
}

async function loadSong(url) {
  setStatus('Carregando...');
  const filename = decodeURIComponent(url.split('/').pop());
  const dirUrl = url.replace(/\/[^/]+$/, '');
  const isMini = /\.miniusf$/i.test(filename);

  // Shutdown anterior
  try { CC._n64_shutdown(); } catch(e) {}
  
  // Aloca e inicializa state do emulador N64 (lazyusf2 precisa de ~32MB)
  let statePtr = 0;
  try {
    statePtr = CC.allocate(new Uint8Array(256 * 1024), CC.ALLOC_NORMAL);
    CC._usf_clear(statePtr);
    console.log('[USF] usf_clear OK (256KB)');
  } catch(e) {
    console.log('[USF] tentando 32MB state...');
    statePtr = CC.allocate(new Uint8Array(32 * 1024 * 1024), CC.ALLOC_NORMAL);
    CC._usf_clear(statePtr);
    console.log('[USF] usf_clear OK (32MB), statePtr:', statePtr);
  }

  if (isMini) {
    const songData = await fetchBin(url);
    const libName = findLibTag(songData);
    if (libName) {
      try {
        const libData = await fetchBin(dirUrl+'/'+encodeURIComponent(libName));
        const libPtr = CC.allocate(libData, CC.ALLOC_NORMAL);
        console.log('[USF] loading lib:', libName, libData.length, 'bytes');
        // Tenta (state, data, len, is_lib) — assinatura lazyusf2
        const r = CC._n64_load_file(statePtr, libPtr, libData.length, 1);
        console.log('[USF] lib load ret:', r);
      } catch(e) { console.warn('[USF] lib failed:', e); }
    }
    const songPtr = CC.allocate(songData, CC.ALLOC_NORMAL);
    console.log('[USF] loading song:', songData.length, 'bytes');
    const r2 = CC._n64_load_file(statePtr, songPtr, songData.length, 0);
    console.log('[USF] song load ret:', r2);
  } else {
    const data = await fetchBin(url);
    const ptr = CC.allocate(data, CC.ALLOC_NORMAL);
    const r = CC._n64_load_file(statePtr, ptr, data.length, 0);
    console.log('[USF] load ret:', r);
  }

  const actualSR = CC._n64_get_duration_ms ? SR : SR;
  setupAudio(actualSR);

  const n = filename.replace(/\.[^.]+$/, '');
  setStatus('\u266A ' + n);
  try { window.parent.postMessage({type:'ready'}, '*'); } catch(e) {}
}

function setupAudio(sr) {
  if (audioCtx) { try { audioCtx.close(); } catch(e) {} }
  audioCtx = new AudioContext({sampleRate: sr});
  gainNode = audioCtx.createGain();
  gainNode.gain.value = 1;

  // Allocate render buffer once
  if (!renderBufPtr) {
    renderBufPtr = CC.allocate(new Uint8Array(BS*4), CC.ALLOC_NORMAL);
  }

  processor = audioCtx.createScriptProcessor(BS, 0, 2);
  processor.onaudioprocess = ev => {
    const L = ev.outputBuffer.getChannelData(0);
    const R = ev.outputBuffer.getChannelData(1);
    const ret = CC._n64_render_audio(renderBufPtr, BS);
    if (ret < 0) { L.fill(0); R.fill(0); return; }
    const buf = new Int16Array(CC.HEAP16.buffer, renderBufPtr, BS*2);
    for (let i = 0; i < BS; i++) { L[i] = buf[i*2]/32768; R[i] = buf[i*2+1]/32768; }
    const posMs = CC._n64_get_position_ms();
    const durMs = CC._n64_get_duration_ms();
    try { window.parent.postMessage({type:'position', posMs, durMs}, '*'); } catch(e) {}
  };
  processor.connect(gainNode);
  gainNode.connect(audioCtx.destination);
}

window.addEventListener('message', e => {
  if (!e.data || !CC) return;
  const d = e.data;
  if (d.type==='play' && d.url) loadSong(d.url);
  if (d.type==='pause') { try { audioCtx && audioCtx.suspend(); } catch(e) {} }
  if (d.type==='resume') { try { audioCtx && audioCtx.resume(); } catch(e) {} }
  if (d.type==='volume' && typeof d.level==='number') { if (gainNode) gainNode.gain.value = Math.max(0, d.level); }
  if (d.type==='seek' && typeof d.ms==='number') { try { CC._n64_seek_ms(d.ms); } catch(e) {} }
});

(async () => {
  CC = await CHIP_CORE_init({
    locateFile: p => p==='chip-core.wasm'
      ? new URL('./chip-core.wasm', import.meta.url).href : p
  });
  if (songUrl) await loadSong(songUrl);
  else { setStatus('Pronto'); try { window.parent.postMessage({type:'ready'}, '*'); } catch(e) {} }
})();
</script>
</body>
</html>
