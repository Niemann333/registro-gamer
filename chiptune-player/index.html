<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Chiptune Player</title>
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:#070d07; overflow:hidden; }
    #status {
      font-family:monospace; font-size:10px; color:#2a5a2a;
      padding:4px 8px; white-space:nowrap; overflow:hidden;
      text-overflow:ellipsis; height:22px; line-height:14px;
    }
    #status.playing { color:#39ff14; }
    #status.error   { color:#ff4444; }
    #root { display:none; }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="status">Inicializando...</div>
  <script>
    var _ctx       = null;
    var _ctxStart  = 0;
    var _scp       = null;
    var _scpFading = false;
    var _analyser  = null;
    var _gainNode  = null;
    var _linked    = false;
    var _silCount  = 0;
    var _endedSent = false;
    var _posTimer  = null;
    var _isVGM     = false;
    var _calibrated = false;

    // Captura ScriptProcessorNode para fade
    try {
      var _OrigCSP = AudioContext.prototype.createScriptProcessor
                  || AudioContext.prototype.createJavaScriptNode;
      if (_OrigCSP) {
        AudioContext.prototype.createScriptProcessor =
        AudioContext.prototype.createJavaScriptNode = function() {
          var node = _OrigCSP.apply(this, arguments);
          _scp = node;
          return node;
        };
      }
    } catch(e) {}

    // Captura AudioContext + GainNode para volume
    var _OrigAC = window.AudioContext || window.webkitAudioContext;
    if (_OrigAC) {
      var _Wrap = function() {
        _ctx = new _OrigAC();
        try {
          _analyser = _ctx.createAnalyser();
          _analyser.fftSize = 2048;
          _analyser.smoothingTimeConstant = 0.8;
          _analyser.smoothingTimeConstant = 0.8;
          var _oc = AudioNode.prototype.connect;
          AudioNode.prototype.connect = function(dest, a, b) {
            if (_ctx && dest === _ctx.destination) {
              if (!_linked) {
                _linked = true;
                _gainNode = _ctx.createGain();
                _gainNode.gain.value = 1.0;
                _oc.call(_analyser, _gainNode);
                _oc.call(_gainNode, _ctx.destination);
              }
              return _oc.call(this, _analyser, a, b);
            }
            return _oc.apply(this, arguments);
          };
        } catch(e) {}
        return _ctx;
      };
      _Wrap.prototype = _OrigAC.prototype;
      window.AudioContext = window.webkitAudioContext = _Wrap;
    }

    var _visTimer = null;
    function startVisTimer() {
      if (_visTimer) return;
      _visTimer = setInterval(function() {
        if (!_analyser || !_ctx || _ctx.state !== 'running') return;
        try {
          var osc = new Uint8Array(_analyser.fftSize);
          _analyser.getByteTimeDomainData(osc);
          var fft = new Uint8Array(_analyser.frequencyBinCount);
          _analyser.getByteFrequencyData(fft);
          // Downsamples para 256 pontos cada
          var oscOut = new Uint8Array(256);
          var fftOut = new Uint8Array(128);
          var step = Math.floor(osc.length / 256);
          for (var i = 0; i < 256; i++) oscOut[i] = osc[i * step];
          for (var i = 0; i < 128; i++) fftOut[i] = fft[Math.floor(i * fft.length / 128)];
          window.parent.postMessage({ type: 'visdata', osc: oscOut, fft: fftOut }, '*');
        } catch(e) {}
      }, 33); // ~30fps
    }
    function stopVisTimer() {
      if (_visTimer) { clearInterval(_visTimer); _visTimer = null; }
    }

    function doFadeOut() {
      if (!_scp || _scpFading) return;
      _scpFading = true;
      var orig = _scp.onaudioprocess;
      var sr = _ctx ? _ctx.sampleRate : 44100;
      var total = sr * 3;
      var done = 0;
      _scp.onaudioprocess = function(e) {
        if (orig) orig.call(_scp, e);
        done += e.outputBuffer.length;
        var gain = Math.max(0, 1.0 - done / total);
        var ob = e.outputBuffer;
        for (var c = 0; c < ob.numberOfChannels; c++) {
          var d = ob.getChannelData(c);
          for (var i = 0; i < d.length; i++) d[i] *= gain;
        }
      };
    }

    function checkSilence() {
      if (!_analyser || !_ctx || _ctx.state !== 'running' || _endedSent) return;
      try {
        var buf = new Float32Array(_analyser.fftSize);
        _analyser.getFloatTimeDomainData(buf);
        var rms = 0;
        for (var i = 0; i < buf.length; i++) rms += buf[i] * buf[i];
        rms = Math.sqrt(rms / buf.length);
        if (rms < 0.001) { _silCount++; } else { _silCount = 0; }
        if (_silCount >= 6) {
          _endedSent = true;
          try { window.parent.postMessage({ type: 'songEnded' }, '*'); } catch(e) {}
        }
      } catch(e) {}
    }

    function player() {
      try {
        return window.ChipPlayer && window.ChipPlayer.sequencer
          ? window.ChipPlayer.sequencer.getPlayer()
          : null;
      } catch(e) { return null; }
    }

    var songUrl = null, playerReady = false;

    var params = new URLSearchParams(window.location.search);
    if (params.get('url')) {
      songUrl = decodeURIComponent(params.get('url'));
    }

    function seq() { return window.ChipPlayer && window.ChipPlayer.sequencer; }
    function setStatus(m, c) { var el = document.getElementById('status'); el.textContent = m; el.className = c || ''; }

    function startPoller(isVGM) {
      if (_posTimer) clearInterval(_posTimer);
      _isVGM      = !!isVGM;
      _ctxStart   = 0;
      _calibrated = false;
      _endedSent  = false;
      _silCount   = 0;
      _scpFading  = false;

      // Envia info de vozes ao gadget
      setTimeout(function() {
        try {
          var p = window.ChipPlayer.sequencer.player;
          if (p && p.getVoiceName) {
            var names = [], groups = [];
            for (var i = 0; i < 64; i++) {
              var n = p.getVoiceName(i);
              if (!n) break;
              names.push(n);
            }
            try { groups = p.getVoiceGroups() || []; } catch(e) {}
            if (names.length > 0) {
              window.parent.postMessage({
                type: 'voices',
                names: names,
                mask: p.getVoiceMask(),
                groups: groups
              }, '*');
            }
          }
        } catch(e) {}
      }, 800);

      _posTimer = setInterval(function() {        if (!_ctx || _ctx.state !== 'running') return;
        if (!_calibrated) { _calibrated = true; _ctxStart = _ctx.currentTime; startVisTimer(); }

        var posMs = 0, durMs = 0;
        var p = player();
        if (_isVGM) {
          posMs = Math.round((_ctx.currentTime - _ctxStart) * 1000);
        } else {
          if (p && p.getPositionMs) try { posMs = p.getPositionMs(); } catch(e) {}
        }
        if (p && p.getDurationMs) try { durMs = p.getDurationMs(); } catch(e) {}

        try { window.parent.postMessage({ type: 'position', posMs: posMs, durMs: durMs }, '*'); } catch(e) {}
        checkSilence();
      }, 250);
    }

    window.addEventListener('message', function(e) {
      if (!e.data) return;
      var d = e.data;
      if (d.type === 'play' && d.url) {
        songUrl = d.url; _endedSent = false; _scpFading = false;
        if (playerReady) startPlay();
      }
      if (d.type === 'voicemask' && d.mask) {
        try {
          var p = window.ChipPlayer.sequencer.player;
          if (p && p.setVoiceMask) p.setVoiceMask(d.mask);
        } catch(e) {}
      }
      if (d.type === 'volume' && typeof d.level === 'number') {
        if (_gainNode) _gainNode.gain.value = Math.max(0, d.level);
      }
      if (d.type === 'pause')   { try { if (_ctx && _ctx.state === 'running')   _ctx.suspend(); } catch(e) {} }
      if (d.type === 'resume')  { try { if (_ctx && _ctx.state === 'suspended') _ctx.resume();  } catch(e) {} }
      if (d.type === 'fadeout') { doFadeOut(); }
      if (d.type === 'seek' && typeof d.ms === 'number') {
        var p = player();
        if (p && p.seekMs) try { p.seekMs(d.ms); if (_ctx) _ctxStart = _ctx.currentTime - d.ms / 1000; } catch(e) {}
      }
    });

    function startPlay() {
      if (!songUrl || !seq()) return;
      try { if (_ctx && _ctx.state === 'suspended') _ctx.resume(); } catch(e) {}
      _endedSent = false; _silCount = 0; _scpFading = false;
      var n = songUrl.split('/').pop().replace(/\.[^.]+$/, '');
      try { n = decodeURIComponent(n); } catch(e) {}
      setStatus('\u266A ' + n, 'playing');
      try {
        seq().playSonglist([songUrl]);
        var isVGM = /\.(vgm|vgz)$/i.test(songUrl);
        startPoller(isVGM);
      } catch(ex) { setStatus('Erro: ' + ex.message, 'error'); }
    }

    if ('serviceWorker' in navigator) {
      var swPath = (location.pathname.replace(/\/[^/]*$/, '') || '') + '/sw.js';
      navigator.serviceWorker.register(swPath).then(function(reg) {
        if (reg.installing) reg.installing.addEventListener('statechange', function() { if (this.state === 'activated') location.reload(); });
        else if (reg.waiting) reg.waiting.addEventListener('statechange', function() { if (this.state === 'activated') location.reload(); });
        else loadBundle();
      }).catch(loadBundle);
    } else loadBundle();

    function loadBundle() {
      var s = document.createElement('script');
      s.src = (location.pathname.replace(/\/[^/]*$/, '')) + '/static/js/main.0a47.js';
      s.onload = function() {
        var tries = 0, iv = setInterval(function() {
          tries++;
          if (seq()) {
            clearInterval(iv); playerReady = true;
            try { window.parent.postMessage({ type: 'ready' }, '*'); } catch(e) {}
            if (songUrl) startPlay(); else setStatus('Pronto.', '');
          } else if (tries > 100) { clearInterval(iv); setStatus('Timeout.', 'error'); }
        }, 300);
      };
      s.onerror = function() { setStatus('Erro ao carregar bundle.', 'error'); };
      document.head.appendChild(s);
    }
  </script>
</body>
</html>
