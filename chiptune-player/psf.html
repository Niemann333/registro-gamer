<!DOCTYPE html>
<html>
<head><meta charset="utf-8">
<style>
*{margin:0;padding:0}
body{background:#111;color:#aaa;font-family:monospace;font-size:11px;height:22px;overflow:hidden}
#status{padding:3px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div id="status">Inicializando...</div>
<script src="scriptprocessor_player.min.js"></script>
<script src="backend_psx.js"></script>
<script>
(function(){
var params  = new URLSearchParams(location.search);
var songUrl = params.get('url');
var setStatus = function(t){ document.getElementById('status').textContent = t; };

var inst = null;
var posInterval = null;
var currentName = '';

function getInst(){ if(!inst) try{ inst = ScriptNodePlayer.getInstance(); }catch(e){} return inst; }

/* Expõe dados de frequência para o osciloscopio do gadget (mesmo domínio) */
window.getFreqData = function(){
  try{ return getInst().getFreqByteData(); }catch(e){ return null; }
};

function startPositionUpdates(){
  if(posInterval) clearInterval(posInterval);
  posInterval = setInterval(function(){
    var i = getInst(); if(!i) return;
    try{
      /* getPlaybackPosition retorna posição, getMaxPlaybackPosition retorna duração */
      var pos = i.getPlaybackPosition();    // provavelmente ms
      var dur = i.getMaxPlaybackPosition(); // provavelmente ms
      /* fallback: getCurrentPlaytime() retorna segundos */
      if(!pos || pos < 0) pos = (i.getCurrentPlaytime && i.getCurrentPlaytime()) * 1000 || 0;
      parent.postMessage({type:'position', posMs: Math.round(pos), durMs: Math.round(dur||0)}, '*');
    }catch(e){}
  }, 500);
}

function doLoad(url){
  currentName = decodeURIComponent(url.split('/').pop()).replace(/\.[^.]+$/,'');
  setStatus('Carregando...');
  inst = null;
  if(posInterval){ clearInterval(posInterval); posInterval = null; }
  ScriptNodePlayer.loadMusicFromURL(url, {});

  /* Aguarda player iniciar e pega info da música */
  var tries = 0;
  var waitReady = setInterval(function(){
    var i = getInst();
    if(!i){ if(++tries > 30) clearInterval(waitReady); return; }
    var info = i.getSongInfo && i.getSongInfo();
    var title = (info && info.title) ? info.title : currentName;
    var game  = (info && info.game)  ? ' — ' + info.game : '';
    setStatus('\u266A ' + title + game);
    startPositionUpdates();
    try{ parent.postMessage({type:'ready'}, '*'); }catch(e){}
    clearInterval(waitReady);
  }, 500);
}

/* Inicializa PSX backend */
ScriptNodePlayer.initialize(
  new PSXBackendAdapter(false),
  function(){ try{ parent.postMessage({type:'ended'}, '*'); }catch(e){} },
  [], true, undefined
).then(function(){
  if(songUrl) doLoad(songUrl);
  else{ setStatus('Pronto'); try{ parent.postMessage({type:'ready'}, '*'); }catch(e){} }
});

/* Controles via postMessage do gadget */
window.addEventListener('message', function(e){
  if(!e.data) return;
  var d = e.data;
  var i = getInst();

  if(d.type === 'play' && d.url)  doLoad(d.url);
  if(d.type === 'pause'  && i)  { try{ i.pause();  }catch(ex){} if(posInterval){ clearInterval(posInterval); posInterval=null; } }
  if(d.type === 'resume' && i)  { try{ i.resume(); }catch(ex){} startPositionUpdates(); }
  if(d.type === 'volume' && i && typeof d.level === 'number') try{ i.setVolume(d.level); }catch(ex){}
  if(d.type === 'seek'   && i && typeof d.ms === 'number')    try{ i.seekPlaybackPosition && i.seekPlaybackPosition(d.ms); }catch(ex){}
});
})();
</script>
</body>
</html>
