<!DOCTYPE html>
<html>
<head><meta charset="utf-8">
<style>
*{margin:0;padding:0}
body{background:#111;color:#aaa;font-family:monospace;font-size:11px;height:22px;overflow:hidden}
#status{padding:3px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div id="status">Inicializando...</div>

<script src="scriptprocessor_player.min.js"></script>
<script src="backend_psx.js"></script>
<script>
(function() {
  var params = new URLSearchParams(location.search);
  var songUrl = params.get('url');
  var setStatus = function(t) { document.getElementById('status').textContent = t; };

  var currentName = '';
  var songStartMs = null;    // performance.now() quando começou
  var totalPausedMs = 0;     // ms acumulados em pause
  var pauseStartMs = null;   // quando entrou em pause
  var posInterval = null;
  var ctx = null;

  function getCtx() {
    if (!ctx) try { ctx = ScriptNodePlayer.getWebAudioContext(); } catch(e) {}
    return ctx;
  }

  function startPositionUpdates() {
    if (posInterval) clearInterval(posInterval);
    posInterval = setInterval(function() {
      if (songStartMs === null) return;
      var now = performance.now();
      var paused = pauseStartMs !== null ? (now - pauseStartMs) : 0;
      var elapsed = now - songStartMs - totalPausedMs - paused;
      try { parent.postMessage({type:'position', posMs: Math.round(elapsed), durMs: 0}, '*'); } catch(e) {}
    }, 500);
  }

  function doLoad(url) {
    currentName = decodeURIComponent(url.split('/').pop()).replace(/\.[^.]+$/, '');
    setStatus('Carregando...');
    songStartMs = null;
    totalPausedMs = 0;
    pauseStartMs = null;
    if (posInterval) { clearInterval(posInterval); posInterval = null; }

    var c = getCtx();
    if (c) c.resume();
    ScriptNodePlayer.loadMusicFromURL(url, {});

    // Aguarda 1.5s e marca início (tempo suficiente para PSF inicializar)
    setTimeout(function() {
      var c2 = getCtx();
      if (c2 && c2.state === 'running') {
        songStartMs = performance.now();
        setStatus('\u266A ' + currentName);
        startPositionUpdates();
        try { parent.postMessage({type:'ready'}, '*'); } catch(e) {}
      } else if (c2) {
        // AudioContext ainda suspenso — aguarda mais
        c2.resume().then(function() {
          songStartMs = performance.now();
          setStatus('\u266A ' + currentName);
          startPositionUpdates();
          try { parent.postMessage({type:'ready'}, '*'); } catch(e) {}
        });
      }
    }, 1500);
  }

  // Inicializa backend PSX
  var backend = new PSXBackendAdapter(false);

  ScriptNodePlayer.initialize(
    backend,
    function() { try { parent.postMessage({type:'ended'}, '*'); } catch(e) {} },
    [], true, undefined
  ).then(function() {
    var c = getCtx();
    if (c) c.resume();

    if (songUrl) {
      doLoad(songUrl);
    } else {
      setStatus('Pronto');
      try { parent.postMessage({type:'ready'}, '*'); } catch(e) {}
    }
  });

  // Controles via postMessage do gadget
  window.addEventListener('message', function(e) {
    if (!e.data) return;
    var d = e.data;
    var c = getCtx();

    if (d.type === 'play' && d.url) {
      doLoad(d.url);
    }
    if (d.type === 'pause' && c) {
      if (pauseStartMs === null) pauseStartMs = performance.now();
      c.suspend();
      if (posInterval) { clearInterval(posInterval); posInterval = null; }
    }
    if (d.type === 'resume' && c) {
      if (pauseStartMs !== null) {
        totalPausedMs += performance.now() - pauseStartMs;
        pauseStartMs = null;
      }
      c.resume();
      startPositionUpdates();
    }
    if (d.type === 'volume' && typeof d.level === 'number') {
      // Volume via GainNode master se disponível
      try { ScriptNodePlayer.getInstance().setVolume && ScriptNodePlayer.getInstance().setVolume(d.level); } catch(ex) {}
    }
  });
})();
</script>
</body>
</html>
