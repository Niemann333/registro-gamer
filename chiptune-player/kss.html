<!DOCTYPE html>
<html>
<head><meta charset="utf-8">
<style>
*{margin:0;padding:0}
body{background:#0a0a0a;color:#39ff14;font-family:monospace;font-size:11px;height:22px;overflow:hidden}
#status{padding:3px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div id="status">Inicializando...</div>

<script src="scriptprocessor_player.min.js"></script>
<script>
/* Pre-aquece e mantém o AudioContext vivo com buffer silencioso em loop.
   Sem isto, o Chrome suspende o contexto se o áudio demorar a começar. */
var _keepAliveNode = null;
function _startKeepAlive(ctx) {
  if(_keepAliveNode) return;
  try{
    var src = ctx.createBufferSource();
    var buf = ctx.createBuffer(1, 1, ctx.sampleRate); // 1 amostra silenciosa
    src.buffer = buf;
    src.loop = true;
    src.connect(ctx.destination);
    src.start(0);
    _keepAliveNode = src;
  }catch(e){}
}
function _warmContext() {
  try{
    ScriptNodePlayer._setGlobalWebAudioCtx();
    var ac = ScriptNodePlayer.getWebAudioContext();
    ac.resume().then(function(){ _startKeepAlive(ac); }).catch(function(){});
    _startKeepAlive(ac);
  }catch(e){}
}
_warmContext();
/* Resume ao voltar ao tab */
document.addEventListener('visibilitychange', function(){
  if(!document.hidden) _warmContext();
});
</script>
<script src="backend_nez.js"></script>

<script>
(function(){
var params       = new URLSearchParams(location.search);
var songUrl      = params.get('url');
var defaultTrack = params.get('track') !== null ? parseInt(params.get('track')) : 0;
var setStatus    = function(t){ document.getElementById('status').textContent = t; };

var inst         = null;
var posInterval  = null;
var visRAF       = null;
var fadeDurMs    = 5000;
var totalDurMs   = 0;

/* Auto-track: se o track atual for silencioso, tenta o próximo */
var autoTrack    = defaultTrack;
var autoMaxTrack = 20;  // tenta até 20 tracks
var userPicked   = params.get('track') !== null; // se URL especificou track, não auto-navega

function getInst(){ if(!inst) try{ inst = ScriptNodePlayer.getInstance(); }catch(e){} return inst; }

function startVisLoop(){
  if(visRAF) return;
  var last = 0;
  function frame(ts){
    visRAF = requestAnimationFrame(frame);
    if(ts - last < 34) return; last = ts;
    var i = getInst(); if(!i) return;
    try{
      var fft = i.getFreqByteData();
      if(fft) parent.postMessage({type:'visdata', osc:null, fft:fft}, '*');
    }catch(e){}
  }
  visRAF = requestAnimationFrame(frame);
}
function stopVisLoop(){ if(visRAF){cancelAnimationFrame(visRAF);visRAF=null;} }

function startPositionUpdates(){
  if(posInterval) clearInterval(posInterval);
  posInterval = setInterval(function(){
    var i = getInst(); if(!i) return;
    try{
      var pos = i.getPlaybackPosition() || 0;
      var dur = totalDurMs || i.getMaxPlaybackPosition() || 0;
      if(dur > 0 && fadeDurMs > 0 && pos >= dur - fadeDurMs){
        try{ i.setVolume(Math.max(0,(dur-pos)/fadeDurMs)); }catch(e){}
      }
      parent.postMessage({type:'position', posMs:Math.round(pos), durMs:Math.round(dur)}, '*');
    }catch(e){}
  }, 250);
}

function onTrackEnd(){
  stopVisLoop();
  if(posInterval){ clearInterval(posInterval); posInterval = null; }
  if(!userPicked && autoTrack < autoMaxTrack){
    // Track silencioso — tenta o próximo automaticamente
    autoTrack++;
    doLoad(songUrl, autoTrack);
  } else {
    try{ parent.postMessage({type:'ended'}, '*'); }catch(e){}
  }
}

function doLoad(url, overrideTrack){
  var i = getInst();
  if(i) try{ i.pause(); }catch(e){}
  inst = null; fadeDurMs = 5000; totalDurMs = 0;
  if(posInterval){ clearInterval(posInterval); posInterval = null; }
  stopVisLoop();

  var parts   = url.split(';');
  var fileUrl = parts[0];
  var track   = overrideTrack !== undefined ? overrideTrack :
                (parts.length > 1 ? parseInt(parts[1]) : defaultTrack);
  var trackNum = isNaN(track) ? 0 : track;

  var currentName = decodeURIComponent(fileUrl.split('/').pop()).replace(/\.[^.]+$/,'');
  setStatus('Carregando track ' + trackNum + '...');

  _warmContext();

  ScriptNodePlayer.loadMusicFromURL(fileUrl, { track: trackNum, timeout: 600 });

  var tries = 0;
  var wait = setInterval(function(){
    var i2 = getInst();
    if(!i2){ if(++tries > 100){ setStatus('Erro'); clearInterval(wait); } return; }

    try{ i2.setVolume(1); }catch(e){}
    // Silence timeout de 2s: se o track for silencioso dispara onTrackEnd → próximo track
    try{ i2.setSilenceTimeout(2); }catch(e){}

    var info = null;
    try{ info = i2.getSongInfo && i2.getSongInfo(); }catch(e){}
    var title = (info && info.title) || currentName;
    var tracks = (info && info.tracks) ? '/' + info.tracks : '';
    setStatus('\u266A ' + title + ' [' + trackNum + tracks + ']');

    var meta = null;
    try{ meta = i2.getSongInfoMeta && i2.getSongInfoMeta(); }catch(e){}
    if(meta){
      if(meta.length) totalDurMs = parseFloat(meta.length) * 1000;
      if(meta.fade)   fadeDurMs  = parseFloat(meta.fade) * 1000;
    }

    startPositionUpdates();
    startVisLoop();
    try{ parent.postMessage({type:'ready'}, '*'); }catch(e){}
    clearInterval(wait);
  }, 200);
}

/* Inicializa NEZ backend */
var backend = new NEZBackendAdapter();
backend.setProcessorBufSize(4096);

ScriptNodePlayer.initialize(backend,
  onTrackEnd,  // ← silence timeout → tenta próximo track
  [], true, undefined
).then(function(){
  _warmContext();
  if(songUrl){ autoTrack = defaultTrack; doLoad(songUrl); }
  else{ setStatus('Pronto'); try{ parent.postMessage({type:'ready'}, '*'); }catch(e){} }
});

window.addEventListener('message', function(e){
  if(!e.data) return;
  var d = e.data;
  var i = getInst();
  if(d.type==='play'   && d.url){ userPicked=false; autoTrack=defaultTrack; doLoad(d.url); }
  if(d.type==='pause'  && i){ try{i.pause();}catch(ex){} if(posInterval){clearInterval(posInterval);posInterval=null;} stopVisLoop(); }
  if(d.type==='resume' && i){
    _warmContext();
    try{i.resume();}catch(ex){}
    startPositionUpdates(); startVisLoop();
  }
  if(d.type==='volume' && i && typeof d.level==='number') try{i.setVolume(d.level);}catch(ex){}
  if(d.type==='seek'   && i && typeof d.ms==='number')    try{i.seekPlaybackPosition&&i.seekPlaybackPosition(d.ms);}catch(ex){}
  if(d.type==='track'  && typeof d.num==='number'){ userPicked=true; autoTrack=d.num; doLoad(songUrl||'', d.num); }
});

/* Qualquer clique na página → resume (fallback para URL direta) */
document.addEventListener('click', function(){
  _warmContext();
  try{ var i=getInst(); i&&i.play&&i.play(); }catch(e){}
}, {passive:true});
})();

</script>
</body>
</html>
