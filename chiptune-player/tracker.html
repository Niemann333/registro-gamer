<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tracker · Chiptune Studio</title>
<meta name="theme-color" content="#050a05">
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050a05;--bg3:#0e260e;--line:#163a16;--line2:#1e501e;--tx:#c8ffbe;--tx2:#7fc87a;--tx3:#4f874f;--ac:#1f8a10;--ac2:#39ff14;--barH:42px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:Oxanium,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.bar{position:fixed;left:0;right:0;top:0;height:var(--barH);display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--line);background:#081208;z-index:5}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.06em;font-size:13px;white-space:nowrap;margin-right:6px}
.logo i{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-style:normal;background:linear-gradient(135deg,#39ff14,#1f8a10);box-shadow:0 0 12px #39ff1466}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--bg3);border-radius:8px;padding:5px 11px;font-size:12.5px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--ac2);color:#fff}
.btn.pri{background:linear-gradient(135deg,#2fd010,#1a7a0c);border-color:transparent;color:#041004;text-shadow:none}
.sp{flex:1}
.pill{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:11.5px;color:var(--tx2);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.dot{width:7px;height:7px;border-radius:50%;background:var(--tx3);flex:none}.dot.on{background:#39ff14;box-shadow:0 0 7px #39ff14}
.note{font-size:11.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
canvas#canvas{position:fixed;left:0;top:var(--barH);width:100vw;height:calc(100vh - var(--barH));display:block;outline:none}
#load{position:fixed;inset:var(--barH) 0 0 0;display:grid;place-items:center;text-align:center;z-index:3;background:var(--bg)}
#load .big{font-size:44px}#load h2{margin:8px 0 6px;font-size:19px}#load p{color:var(--tx2);font-size:13px;line-height:1.6;max-width:420px}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--ac2);animation:sp 1s linear infinite;margin:16px auto 0}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#0e260e;border:1px solid var(--line2);border-radius:10px;padding:9px 12px;font-size:13px;z-index:20;display:none;align-items:center;gap:10px;box-shadow:0 8px 30px #000a;max-width:calc(100vw - 20px)}
.toast.show{display:flex}
.toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drop{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:rgba(57,255,20,.15);border:3px dashed var(--ac2);font-size:20px;font-weight:700}
.drop.show{display:grid}
@media (max-width:760px){.note,.logo span{display:none}}
</style>
</head>
<body>
<div class="bar">
  <div class="logo"><i>🎛️</i><span>CHIPTUNE STUDIO · TRACKER</span></div>
  <button class="btn pri" id="bOpen" title="Abrir música, instrumento, wavetable ou sample do seu aparelho. VGM do Mega Drive e do Master System abre direto como projeto, com os timbres do chip">📂 Abrir arquivo local</button>
  <button class="btn" id="bMidi" title="Converter um VGM (arquivo local) em MIDI. Para a música aberta: Arquivo → Exportar → VGM, depois 🎼 MIDI">🎼 VGM → MIDI</button>
  <span class="pill" id="midiPill" title="Teclado MIDI"><span class="dot" id="midiDot"></span><span id="midiTxt">MIDI…</span></span>
  <span class="note" id="note">Salvar (Ctrl+S) ou exportar baixa o arquivo (vai para os Downloads). Nada fica guardado no navegador.</span>
  <div class="sp"></div>
  <button class="btn" id="bBack">← Chiptune Studio</button>
  <button class="btn" id="bClose" title="Fechar e voltar ao blog" style="display:none">✕</button>
</div>
<input type="file" id="fileIn" multiple hidden>
<input type="file" id="midiIn" accept=".vgm,.vgz" multiple hidden>
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<div id="load"><div><div class="big">🎛️</div><h2>Carregando o Tracker</h2>
  <p id="loadTxt">Na primeira vez são cerca de 10 MB; depois fica guardado no navegador e abre rápido.</p><div class="spin"></div></div></div>

<div class="toast" id="toast"><span id="tTxt"></span><button class="btn" id="tFur" style="display:none" title="Abrir este VGM como projeto (timbres do chip)">🎛 Abrir como projeto</button><button class="btn" id="tMidi" style="display:none" title="Converter este VGM para MIDI e baixar">🎼 MIDI</button><button class="btn" id="tX">✕</button></div>
<div class="drop" id="drop">Solte o arquivo para abrir no Tracker</div>

<script>
(function () {
  'use strict';
  var HOME = '/home/web_user';
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var ready = false;

  window.Module = {
    canvas: $('canvas'),
    print: function (t) { console.log(t); },
    printErr: function (t) { console.warn(t); },
    setStatus: function () {},
    onRgReady: function () { ready = true; setTimeout(function () { $('load').style.display = 'none'; }, 400); hookWrites(); setTimeout(checkInbox, 600); },
    onAbort: function () { $('loadTxt').textContent = 'O Tracker parou com um erro. Recarregue a página.'; $('load').style.display = 'grid'; }
  };

  // ── pasta de destino conforme o tipo do arquivo ──
  function folderFor(name) {
    if (/\.(fui|dmp|tfi|vgi|opni|opli|y12|bnk|ff|gyb|sbi|ins|wopn|wopl|s3i|ni|ins)$/i.test(name)) return 'Instrumentos';
    return 'Projetos';
  }
  // põe o arquivo na pasta do Tracker (só na memória, enquanto a página estiver aberta) e abre no Furnace
  function openBytes(name, u8, delay) {
    var safe = name.replace(/[\/\\]/g, '_');
    var path = HOME + '/' + folderFor(safe) + '/' + safe;
    importing[path] = 1;
    Module.FS.writeFile(path, u8);
    delete importing[path];
    setTimeout(function () { Module.ccall('rg_web_drop', null, ['string'], [path]); }, delay || 0);
  }
  // VGM → projeto do Furnace (direto, com os timbres do chip)
  function vgmToFur(u8, name, delay) {
    if (!window.RGVGM || !window.RGFUR) { notify('Conversor de VGM não carregou.'); return; }
    notify('🎛 Convertendo ' + name + ' para o Furnace…');
    RGVGM.inflate(new Uint8Array(u8)).then(function (raw) {
      var r = RGVGM.parse(raw, { events: true, pcm: true });
      var o = RGFUR.build(r);
      var fn = RGFUR.fileName(r, name.replace(/\.[^.]+$/, ''));
      openBytes(fn, o.bytes, delay);
      notify('🎛 ' + fn + ' — ' + (o.instruments - o.samples) + ' instrumentos' + (o.samples ? ', ' + o.samples + ' samples' : '') + ', linha = ' + o.rowFrames + ' quadro' + (o.rowFrames === 1 ? '' : 's') + (o.missing && o.missing.length ? ' · ficou de fora: ' + o.missing.join(', ') : ''));
    }).catch(function (e) { notify('🎛 ' + name + ': ' + (e.message || e)); });
  }
  function openFiles(list) {
    if (!ready) { alert('Espere o Tracker terminar de carregar.'); return; }
    Array.prototype.forEach.call(list, function (f, i) {
      f.arrayBuffer().then(function (ab) {
        if (isVGM(f.name)) { vgmToFur(new Uint8Array(ab), f.name, i * 250); return; }
        var safe = f.name.replace(/[\/\\]/g, '_');
        var path = HOME + '/' + folderFor(safe) + '/' + safe;
        importing[path] = 1;
        Module.FS.writeFile(path, new Uint8Array(ab));
        delete importing[path];
        setTimeout(function () { Module.ccall('rg_web_drop', null, ['string'], [path]); }, i * 250);
      });
    });
    $('canvas').focus();
  }
  $('bOpen').onclick = function () { $('fileIn').value = ''; $('fileIn').click(); };
  $('fileIn').onchange = function () { if (this.files.length) openFiles(this.files); };

  // arrastar e soltar arquivos em cima do Tracker
  var dragN = 0;
  window.addEventListener('dragenter', function (e) { if (e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types, 'Files') >= 0) { dragN++; $('drop').classList.add('show'); } });
  window.addEventListener('dragleave', function () { if (--dragN <= 0) { dragN = 0; $('drop').classList.remove('show'); } });
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('drop', function (e) { e.preventDefault(); dragN = 0; $('drop').classList.remove('show'); if (e.dataTransfer.files.length) openFiles(e.dataTransfer.files); });

  // ── baixar ──
  function download(path) {
    var data = Module.FS.readFile(path), name = path.split('/').pop();
    var url = URL.createObjectURL(new Blob([data], { type: 'application/octet-stream' }));
    var a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 2000);
  }
  function hidden(path) { return path.indexOf(HOME + '/.') === 0 || path.indexOf(HOME + '/') !== 0; }
  // quando o Furnace salva ou exporta algo, o arquivo vai direto para os Downloads
  var pending = {}, pendT = null, lastSaved = null, importing = {};
  function hookWrites() {
    var FS = Module.FS, origClose = FS.close;
    FS.close = function (stream) {
      var path = stream && stream.path, wrote = stream && (stream.flags & 3) !== 0;
      var r = origClose.apply(this, arguments);
      if (wrote && path && !hidden(path) && !importing[path]) { pending[path] = 1; clearTimeout(pendT); pendT = setTimeout(flushSaved, 500); }
      return r;
    };
  }
  function flushSaved() {
    var paths = Object.keys(pending); pending = {};
    if (!paths.length) return;
    paths.forEach(function (p, i) { setTimeout(function () { download(p); }, i * 300); });
    lastSaved = paths[paths.length - 1];
    $('tTxt').textContent = '⬇ Baixado: ' + lastSaved.split('/').pop() + (paths.length > 1 ? ' (+' + (paths.length - 1) + ')' : '');
    $('tMidi').style.display = $('tFur').style.display = isVGM(lastSaved) ? '' : 'none';
    $('toast').classList.add('show');
  }
  $('tMidi').onclick = function () { if (lastSaved) vgmToMidi(Module.FS.readFile(lastSaved), lastSaved.split('/').pop()); };
  $('tFur').onclick = function () { if (lastSaved) vgmToFur(Module.FS.readFile(lastSaved), lastSaved.split('/').pop()); $('canvas').focus(); };

  // projeto mandado pelo Chiptune Studio (botão "Abrir no Tracker")
  function checkInbox() {
    try {
      var rq = indexedDB.open('rg-inbox', 1);
      rq.onupgradeneeded = function () { rq.result.createObjectStore('f'); };
      rq.onsuccess = function () {
        var db = rq.result, tx = db.transaction('f', 'readwrite'), st = tx.objectStore('f'), g = st.get('next');
        // a "caixa de entrada" só serve para a passagem: apaga logo depois de ler
        tx.oncomplete = function () { db.close(); try { indexedDB.deleteDatabase('rg-inbox'); } catch (e) {} };
        g.onsuccess = function () {
          var it = g.result; if (!it) return;
          if (Date.now() - (it.t || 0) > 10 * 60 * 1000) return; // velho demais: ignora
          openBytes(it.name, new Uint8Array(it.bytes), 0);
          notify('🎛 Aberto do Chiptune Studio: ' + it.name);
        };
      };
    } catch (e) {}
  }

  // ── VGM → MIDI (mesmo conversor do Chiptune Studio) ──
  function isVGM(p) { return /\.(vgm|vgz)$/i.test(p || ''); }
  function notify(txt) {
    $('tTxt').textContent = txt; $('tFur').style.display = 'none'; $('tMidi').style.display = 'none';
    $('toast').classList.add('show');
  }
  function vgmToMidi(u8, name) {
    if (!window.RGVGM || !window.RGMIDI) { notify('Conversor de MIDI não carregou.'); return; }
    notify('🎼 Convertendo ' + name + '…');
    RGVGM.inflate(new Uint8Array(u8)).then(function (raw) {
      var r = RGVGM.parse(raw, { events: true, pcm: true });
      if (!r.midi.chans.length) { notify('🎼 ' + name + ': nenhum canal para converter' + (r.unsupported.length ? ' (' + r.unsupported.join(', ') + ' ainda não suportado)' : '') + '.'); return; }
      var out = RGMIDI.build(r, { tempo: true });
      var url = URL.createObjectURL(new Blob([out.bytes], { type: 'audio/midi' }));
      var a = document.createElement('a'); a.href = url; a.download = RGMIDI.fileName(r, name); document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 3000);
      notify('🎼 ' + a.download + ' — ' + out.notas + ' notas, ' + out.trilhas + ' trilhas, ' + (out.tempoDetectado ? out.bpm + ' BPM' : 'tempo livre'));
    }).catch(function (e) { notify('🎼 Não consegui converter ' + name + ' (' + (e.message || e) + ').'); });
  }
  $('bMidi').onclick = function () { $('midiIn').value = ''; $('midiIn').click(); };
  $('midiIn').onchange = function () {
    Array.prototype.forEach.call(this.files, function (f, i) {
      f.arrayBuffer().then(function (ab) { setTimeout(function () { vgmToMidi(new Uint8Array(ab), f.name); }, i * 400); });
    });
  };
  $('tX').onclick = function () { $('toast').classList.remove('show'); };

  $('bBack').onclick = function () { location.href = 'estudio.html'; };
  // dentro do blog: botão ✕ fecha a camada do Chiptune Studio
  var EMBED = window.parent !== window;
  if (EMBED) {
    $('bClose').style.display = '';
    $('bClose').onclick = function () {
      if (unsaved() && !confirm('Fechar o Tracker? O projeto tem alterações que não foram salvas (Ctrl+S) e elas se perdem.')) return;
      try { window.parent.postMessage({ type: 'rg-studio-close' }, '*'); } catch (e) {}
    };
  }

  // ── teclado MIDI (Web MIDI) → fila lida pelo Furnace ──
  Module.rgMidiQ = [];
  var midiNames = [];
  function midiUI(msg) {
    $('midiDot').classList.toggle('on', midiNames.length > 0);
    $('midiTxt').textContent = msg || (midiNames.length ? 'MIDI: ' + midiNames.join(', ') : 'MIDI: nenhum teclado');
    $('midiPill').title = midiNames.length ? 'Teclado MIDI ligado ao Tracker' : 'Ligue um teclado MIDI no USB';
  }
  function onMidi(e) {
    var d = e.data; if (!d || !d.length) return;
    var st = d[0];
    if (st === 0xF0 || st === 0xF8 || st === 0xFE) return; // SysEx, clock e "estou vivo" ficam de fora
    if (Module.rgMidiOpen && Module.rgMidiQ.length < 4000) Module.rgMidiQ.push(Array.prototype.slice.call(d));
  }
  if (navigator.requestMIDIAccess) {
    navigator.requestMIDIAccess({ sysex: false }).then(function (acc) {
      function scan() {
        midiNames = [];
        acc.inputs.forEach(function (inp) { inp.onmidimessage = onMidi; if (inp.state !== 'disconnected') midiNames.push(inp.name || 'Teclado'); });
        midiUI();
      }
      acc.onstatechange = scan; scan();
    }).catch(function () { midiUI('MIDI: sem permissão'); });
  } else midiUI('MIDI: indisponível');

  // ao fechar: avisa só se o projeto tem alterações não salvas (como um programa de computador)
  function unsaved() { try { return ready && Module.ccall('rg_web_modified', 'number', [], []) === 1; } catch (e) { return ready; } }
  window.addEventListener('pagehide', function () { try { Module.FS.syncfs(false, function () {}); } catch (e) {} }); // só as configurações
  window.addEventListener('beforeunload', function (e) { if (unsaved()) { e.preventDefault(); e.returnValue = ''; } });
})();
</script>
<script src="vgm-midi.js"></script>
<script src="furnace.js"></script>
</body>
</html>
