<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Chiptune Player</title>
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:#070d07; overflow:hidden; }
    #status {
      font-family:monospace; font-size:10px; color:#2a5a2a;
      padding:4px 8px; white-space:nowrap; overflow:hidden;
      text-overflow:ellipsis; height:22px; line-height:14px;
    }
    #status.playing { color:#39ff14; }
    #status.error   { color:#ff4444; }
    #root { display:none; }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="status">Inicializando...</div>
  <script>
    var _ctx       = null;
    var _ctxStart  = 0;
    var _scp       = null;
    var _scpFading = false;
    var _analyser  = null;
    var _gainNode  = null;
    var _linked    = false;
    var _silCount  = 0;
    var _endedSent = false;
    var _posTimer  = null;
    var _isVGM     = false;
    var _calibrated = false;
    var _silenceDisabled = false;

    var SF2_LOCAL = 'https://niemann333.github.io/registro-gamer/chiptune-player/soundfonts/gmgsx-plus.sf2';

    try {
      if (navigator.requestMIDIAccess) {
        Object.defineProperty(navigator, 'requestMIDIAccess', {
          value: function() {
            return Promise.resolve({
              inputs:  { size:0, forEach:function(){}, get:function(){}, has:function(){}, keys:function(){ return [][Symbol.iterator](); }, values:function(){ return [][Symbol.iterator](); }, entries:function(){ return [][Symbol.iterator](); } },
              outputs: { size:0, forEach:function(){}, get:function(){}, has:function(){}, keys:function(){ return [][Symbol.iterator](); }, values:function(){ return [][Symbol.iterator](); }, entries:function(){ return [][Symbol.iterator](); } },
              onstatechange:null, sysexEnabled:false
            });
          }, writable:true, configurable:true
        });
      }
    } catch(e) {}

    var _origFetch = window.fetch;
    window.fetch = function(input, init) {
      var url = (typeof input === 'string') ? input : (input && input.url) || '';
      if (url.indexOf('.sf2') !== -1 || url.indexOf('soundfont') !== -1 || url.indexOf('gifx.co/soundfonts') !== -1) {
        return _origFetch.call(this, SF2_LOCAL, init);
      }
      return _origFetch.apply(this, arguments);
    };

    try {
      var _OrigCSP = AudioContext.prototype.createScriptProcessor || AudioContext.prototype.createJavaScriptNode;
      if (_OrigCSP) {
        AudioContext.prototype.createScriptProcessor =
        AudioContext.prototype.createJavaScriptNode = function() {
          var node = _OrigCSP.apply(this, arguments);
          _scp = node;
          return node;
        };
      }
    } catch(e) {}

    var _OrigAC = window.AudioContext || window.webkitAudioContext;
    if (_OrigAC) {
      var _Wrap = function() {
        _ctx = new _OrigAC();
        try {
          _analyser = _ctx.createAnalyser();
          _analyser.fftSize = 2048;
          _analyser.smoothingTimeConstant = 0.8;
          var _oc = AudioNode.prototype.connect;
          AudioNode.prototype.connect = function(dest, a, b) {
            if (_ctx && dest === _ctx.destination) {
              if (!_linked) {
                _linked = true;
                _gainNode = _ctx.createGain();
                _gainNode.gain.value = 1.0;
                _oc.call(_analyser, _gainNode);
                _oc.call(_gainNode, _ctx.destination);
              }
              return _oc.call(this, _analyser, a, b);
            }
            return _oc.apply(this, arguments);
          };
        } catch(e) {}
        return _ctx;
      };
      _Wrap.prototype = _OrigAC.prototype;
      window.AudioContext = window.webkitAudioContext = _Wrap;
    }

    var _visTimer = null;
    function startVisTimer() {
      if (_visTimer) return;
      _visTimer = setInterval(function() {
        if (!_analyser || !_ctx || _ctx.state !== 'running') return;
        try {
          var osc = new Uint8Array(_analyser.fftSize);
          _analyser.getByteTimeDomainData(osc);
          var fft = new Float32Array(_analyser.frequencyBinCount);
          _analyser.getFloatFrequencyData(fft);
          var oscOut = new Uint8Array(256);
          var fftOut = new Float32Array(128);
          var step = Math.floor(osc.length / 256);
          for (var i = 0; i < 256; i++) oscOut[i] = osc[i * step];
          for (var i = 0; i < 128; i++) fftOut[i] = fft[Math.floor(i * fft.length / 128)];
          window.parent.postMessage({ type:'visdata', osc:oscOut, fft:fftOut }, '*');
        } catch(e) {}
      }, 33);
    }

    function doFadeOut() {
      if (!_scp || _scpFading) return;
      _scpFading = true;
      var orig = _scp.onaudioprocess;
      var sr = _ctx ? _ctx.sampleRate : 44100;
      var total = sr * 3;
      var done = 0;
      _scp.onaudioprocess = function(e) {
        if (orig) orig.call(_scp, e);
        done += e.outputBuffer.length;
        var gain = Math.max(0, 1.0 - done / total);
        var ob = e.outputBuffer;
        for (var c = 0; c < ob.numberOfChannels; c++) {
          var d = ob.getChannelData(c);
          for (var i = 0; i < d.length; i++) d[i] *= gain;
        }
      };
    }

    function checkSilence() {
      if (!_analyser || !_ctx || _ctx.state !== 'running' || _endedSent || _silenceDisabled) return;
      try {
        var buf = new Float32Array(_analyser.fftSize);
        _analyser.getFloatTimeDomainData(buf);
        var rms = 0;
        for (var i = 0; i < buf.length; i++) rms += buf[i] * buf[i];
        rms = Math.sqrt(rms / buf.length);
        if (rms < 0.001) { _silCount++; } else { _silCount = 0; }
        if (_silCount >= 6) {
          _endedSent = true;
          try { window.parent.postMessage({ type:'songEnded' }, '*'); } catch(e) {}
        }
      } catch(e) {}
    }

    function player() {
      try {
        return window.ChipPlayer && window.ChipPlayer.sequencer ? window.ChipPlayer.sequencer.getPlayer() : null;
      } catch(e) { return null; }
    }

    // Formatos que usam amostras PCM internas — desliga interpolação
    var PCM_EXTS = /\.(mod|s3m|xm|it|wav|669|amf|ams|dbm|dmf|dsm|far|gdm|med|mtm|okt|ptm|stm|ult)$/i;

    function setNoInterpolation() {
      setTimeout(function(){
        try {
          var p = player();
          if (!p) return;
          if (p.ctl_set) {
            try { p.ctl_set('render.interpolation.quality', '0'); } catch(e) {}
            try { p.ctl_set('interpolation.quality',        '0'); } catch(e) {}
          }
          if (typeof p.interpolation !== 'undefined') p.interpolation = 0;
          if (p.setInterpolationType) p.setInterpolationType(0);
          if (p.setInterpolation)     p.setInterpolation(0);
          if (p.setResampleMode)      p.setResampleMode(0);
        } catch(e) {}
      }, 600);
    }

    var songUrl = null, playerReady = false;

    var params = new URLSearchParams(window.location.search);
    if (params.get('url')) songUrl = decodeURIComponent(params.get('url'));

    function seq() {
      if (window.ChipPlayer && window.ChipPlayer.sequencer) return window.ChipPlayer.sequencer;
      if (window.ChipPlayer && window.ChipPlayer.playContext) return window.ChipPlayer;
      return null;
    }
    function setStatus(m, c) { var el = document.getElementById('status'); el.textContent = m; el.className = c || ''; }

    function startPoller(isVGM) {
      if (_posTimer) clearInterval(_posTimer);
      _isVGM = !!isVGM; _ctxStart = 0; _calibrated = false;
      _endedSent = false; _silCount = 0; _scpFading = false; _silenceDisabled = false;

      setTimeout(function() {
        try {
          var p = window.ChipPlayer.sequencer.player;
          if (p && p.getVoiceName) {
            var names = [], groups = [];
            for (var i = 0; i < 64; i++) { var n = p.getVoiceName(i); if (!n) break; names.push(n); }
            try { groups = p.getVoiceGroups() || []; } catch(e) {}
            var mask = p.getVoiceMask();
            names = names.slice(0, mask.length);
            if (names.length > 0) window.parent.postMessage({ type:'voices', names:names, mask:mask, groups:groups }, '*');
          }
          if (p && p.getNumSubtunes) {
            var num = p.getNumSubtunes();
            if (num > 1) {
              var durs = p.subtuneDurations || [];
              window.parent.postMessage({ type:'sid-subsongs', count:num, current:p.getSubtune(), durations:Array.prototype.slice.call(durs) }, '*');
            }
          }
        } catch(e) {}
      }, 800);

      _posTimer = setInterval(function() {
        if (!_ctx || _ctx.state !== 'running') return;
        if (!_calibrated) { _calibrated = true; _ctxStart = _ctx.currentTime; startVisTimer(); }
        var posMs = 0, durMs = 0;
        var p = player();
        if (_isVGM) { posMs = Math.round((_ctx.currentTime - _ctxStart) * 1000); }
        else { if (p && p.getPositionMs) try { posMs = p.getPositionMs(); } catch(e) {} }
        if (p && p.getDurationMs) try { durMs = p.getDurationMs(); } catch(e) {}
        try { window.parent.postMessage({ type:'position', posMs:posMs, durMs:durMs }, '*'); } catch(e) {}
        checkSilence();
      }, 250);
    }

    window.addEventListener('message', function(e) {
      if (!e.data) return;
      var d = e.data;
      if (d.type === 'play' && d.url) {
        songUrl = d.url; _endedSent = false; _scpFading = false;
        if (playerReady) schedulePlay();
      }
      if (d.type === 'sid-subsong' && typeof d.index === 'number') {
        try { if (window.ChipPlayer.sequencer) window.ChipPlayer.sequencer.playSubtune(d.index); } catch(e) {}
      }
      if (d.type === 'subsong' && typeof d.index === 'number') {
        try { if (window.ChipPlayer.sequencer) window.ChipPlayer.sequencer.playSubtune(d.index); } catch(e) {}
      }
      if (d.type === 'voicemask' && d.mask) {
        try {
          if (window.ChipPlayer.sequencer) {
            var p = window.ChipPlayer.sequencer.player;
            if (p && p.setVoiceMask) p.setVoiceMask(d.mask);
          } else if (window.ChipPlayer.handleSetVoiceMask) {
            window.ChipPlayer.handleSetVoiceMask(d.mask);
          }
        } catch(e) {}
        _silenceDisabled = !!d.hasMute;
      }
      if (d.type === 'volume' && typeof d.level === 'number') {
        if (_gainNode) _gainNode.gain.value = Math.max(0, d.level);
      }
      if (d.type === 'mediainfo') {
        if ('mediaSession' in navigator) {
          try {
            navigator.mediaSession.metadata = new MediaMetadata({ title:d.title||'', artist:d.artist||'', album:d.album||'Registro Gamer' });
            var _ms = navigator.mediaSession;
            _ms.setActionHandler('nexttrack',     function(){ parent.postMessage({type:'ms-action',action:'next'},  '*'); });
            _ms.setActionHandler('previoustrack', function(){ parent.postMessage({type:'ms-action',action:'prev'},  '*'); });
            _ms.setActionHandler('play',          function(){ parent.postMessage({type:'ms-action',action:'play'},  '*'); });
            _ms.setActionHandler('pause',         function(){ parent.postMessage({type:'ms-action',action:'pause'},'*'); });
            _ms.playbackState = 'playing';
          } catch(e) {}
        }
      }
      if (d.type === 'positioninfo' && d.duration > 0) {
        if ('mediaSession' in navigator) {
          try {
            navigator.mediaSession.setPositionState({ duration:d.duration, playbackRate:1, position:Math.min(Math.max(0, d.position||0), d.duration) });
          } catch(e) {}
        }
      }
      if (d.type === 'ms-state') {
        if ('mediaSession' in navigator) { try { navigator.mediaSession.playbackState = d.state; } catch(e) {} }
      }
      if (d.type === 'pause')   { try { if (_ctx && _ctx.state === 'running')   _ctx.suspend(); } catch(e) {} }
      if (d.type === 'resume')  { try { if (_ctx && _ctx.state === 'suspended') _ctx.resume();  } catch(e) {} }
      if (d.type === 'fadeout') { doFadeOut(); }
      if (d.type === 'seek' && typeof d.ms === 'number') {
        var p = player();
        if (p && p.seekMs) try { p.seekMs(d.ms); if (_ctx) _ctxStart = _ctx.currentTime - d.ms / 1000; } catch(e) {}
      }
    });

    var _playRetries = 0;
    function schedulePlay() { _playRetries = 0; if (seq()) startPlay(); else _retryPlay(); }
    function _retryPlay() {
      if (_playRetries++ > 20) { setStatus('Player não pronto.', 'error'); return; }
      setTimeout(function() { if (seq()) startPlay(); else _retryPlay(); }, 300);
    }
    function startPlay() {
      var cp = window.ChipPlayer;
      if (!songUrl || !seq()) { _retryPlay(); return; }
      try { if (_ctx && _ctx.state === 'suspended') _ctx.resume(); } catch(e) {}
      _endedSent = false; _silCount = 0; _scpFading = false;
      var n = songUrl.split('/').pop().replace(/\.[^.]+$/, '');
      try { n = decodeURIComponent(n); } catch(e) {}
      setStatus('\u266A ' + n, 'playing');
      try {
        if (cp && cp.sequencer) { cp.sequencer.playSonglist([songUrl]); }
        else if (cp && cp.playContext) { cp.playContext.call(cp, [{ url:songUrl, title:n }]); }
        else { _retryPlay(); return; }
        var isVGM = /\.(vgm|vgz)$/i.test(songUrl);
        startPoller(isVGM);
        if (PCM_EXTS.test(songUrl)) setNoInterpolation();
      } catch(ex) {
        if (_playRetries < 5) { setStatus('Tentando...', ''); _retryPlay(); }
        else { setStatus('Erro: ' + ex.message, 'error'); }
      }
    }

    if ('serviceWorker' in navigator) {
      var swPath = (location.pathname.replace(/\/[^/]*$/, '') || '') + '/sw.js';
      navigator.serviceWorker.register(swPath).then(function(reg) {
        if (reg.installing) reg.installing.addEventListener('statechange', function() { if (this.state === 'activated') location.reload(); });
        else if (reg.waiting) reg.waiting.addEventListener('statechange', function() { if (this.state === 'activated') location.reload(); });
        else loadBundle();
      }).catch(loadBundle);
    } else loadBundle();

    function loadBundle() {
      var s = document.createElement('script');
      s.src = (location.pathname.replace(/\/[^/]*$/, '')) + '/static/js/main.0a47.js';
      s.onload = function() {
        var tries = 0, iv = setInterval(function() {
          tries++;
          if (seq()) {
            clearInterval(iv); playerReady = true;
            try { window.parent.postMessage({ type:'ready' }, '*'); } catch(e) {}
            if (songUrl) schedulePlay(); else setStatus('Pronto.', '');
          } else if (tries > 100) { clearInterval(iv); setStatus('Timeout.', 'error'); }
        }, 300);
      };
      s.onerror = function() { setStatus('Erro ao carregar bundle.', 'error'); };
      document.head.appendChild(s);
    }
  </script>
</body>
</html>
