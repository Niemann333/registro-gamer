<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>SAP Player</title>
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:#070d07; overflow:hidden; }
    #status {
      font-family:monospace; font-size:10px; color:#2a5a2a;
      padding:4px 8px; white-space:nowrap; overflow:hidden;
      text-overflow:ellipsis; height:22px; line-height:14px;
    }
    #status.playing { color:#39ff14; }
    #status.error   { color:#ff4444; }
  </style>
</head>
<body>
  <div id="status">Inicializando...</div>
  <script type="module">
    import { asapWeb } from './asapweb.js';

    var songUrl     = null;
    var loopCount   = 1;
    var currentSong = 0;
    var posTimer    = null;
    var analyser    = null;
    var gainNode    = null;
    var volLevel    = 1.0;
    var silCount    = 0;
    var endedSent   = false;
    var scpFading   = false;

    function setStatus(m, c) {
      var el = document.getElementById('status');
      el.textContent = m; el.className = c || '';
    }

    var params = new URLSearchParams(window.location.search);
    if (params.get('url')) songUrl = decodeURIComponent(params.get('url'));

    var _origOAP = null;  // onaudioprocess original salvo

    var _visTimer = null;
    function startVisTimer() {
      if (_visTimer) return;
      _visTimer = setInterval(function() {
        if (!analyser) return;
        var ctx = asapWeb.context;
        if (!ctx || ctx.state !== 'running') return;
        try {
          var osc = new Uint8Array(analyser.fftSize);
          analyser.getByteTimeDomainData(osc);
          var fft = new Uint8Array(analyser.frequencyBinCount);
          analyser.getByteFrequencyData(fft);
          var oscOut = new Uint8Array(256);
          var fftOut = new Uint8Array(128);
          var step = Math.floor(osc.length / 256);
          for (var i = 0; i < 256; i++) oscOut[i] = osc[i * step];
          for (var i = 0; i < 128; i++) fftOut[i] = fft[Math.floor(i * fft.length / 128)];
          window.parent.postMessage({ type: 'visdata', osc: oscOut, fft: fftOut }, '*');
        } catch(e) {}
      }, 33);
    }

    function hookAnalyser() {
      var ctx = asapWeb.context;
      var proc = asapWeb.processor;
      if (!ctx || !proc) return;
      try {
        _origOAP = proc.onaudioprocess;
        analyser = ctx.createAnalyser();
        analyser.fftSize = 2048;
        analyser.smoothingTimeConstant = 0.8;
        window._analyser = analyser;  // expõe para o visualizador do gadget
        gainNode = ctx.createGain();
        gainNode.gain.value = volLevel;
        proc.disconnect();
        proc.connect(analyser);
        analyser.connect(gainNode);
        gainNode.connect(ctx.destination);
      } catch(e) {}
    }

    function doFadeOut() {
      var proc = asapWeb.processor;
      if (!proc || scpFading) return;
      scpFading = true;
      var orig  = proc.onaudioprocess;  // pode já ser o salvo
      var sr    = asapWeb.context ? asapWeb.context.sampleRate : 44100;
      var total = sr * 3;
      var done  = 0;
      proc.onaudioprocess = function(e) {
        if (orig) orig.call(proc, e);
        done += e.outputBuffer.length;
        var gain = Math.max(0, 1.0 - done / total);
        for (var c = 0; c < e.outputBuffer.numberOfChannels; c++) {
          var d = e.outputBuffer.getChannelData(c);
          for (var i = 0; i < d.length; i++) d[i] *= gain;
        }
      };
    }

    function checkSilence() {
      if (!analyser || endedSent) return;
      var ctx = asapWeb.context;
      if (!ctx || ctx.state !== 'running') return;
      try {
        var buf = new Float32Array(analyser.fftSize);
        analyser.getFloatTimeDomainData(buf);
        var rms = 0;
        for (var i = 0; i < buf.length; i++) rms += buf[i] * buf[i];
        rms = Math.sqrt(rms / buf.length);
        if (rms < 0.001) { silCount++; } else { silCount = 0; }
        if (silCount >= 6) {
          endedSent = true;
          try { window.parent.postMessage({ type: 'songEnded' }, '*'); } catch(e) {}
        }
      } catch(e) {}
    }

    function calcDuration(song) {
      if (!asapWeb.asap) return -1;
      try {
        var info = asapWeb.asap.getInfo();
        var dur  = info.getDuration(song);
        if (dur <= 0) return -1;
        return info.getLoop(song) ? dur * loopCount : dur;
      } catch(e) { return -1; }
    }

    function startPoller(graceMs) {
      if (posTimer) clearInterval(posTimer);
      silCount  = 0;
      endedSent = false;
      scpFading = false;
      var graceUntil = Date.now() + (graceMs || 2000);
      posTimer  = setInterval(function() {
        if (!asapWeb.asap || !asapWeb.context) return;
        var posMs = 0, durMs = 0;
        try { posMs = asapWeb.asap.getPosition(); } catch(e) {}
        try { durMs = calcDuration(currentSong); } catch(e) {}
        try {
          window.parent.postMessage({ type: 'position', posMs: posMs, durMs: durMs > 0 ? durMs : 0 }, '*');
        } catch(e) {}
        // Só checa silêncio após período de graça
        if (Date.now() > graceUntil) checkSilence();
      }, 250);
    }

    function startPlay() {
      if (!songUrl) { setStatus('Sem URL', 'error'); return; }
      var name = songUrl.split('/').pop().replace(/\.[^.]+$/, '');
      try { name = decodeURIComponent(name); } catch(e) {}
      setStatus('\u266A ' + name, 'playing');
      scpFading = false; endedSent = false; silCount = 0;

      asapWeb.playUrl(songUrl, currentSong);

      var tries = 0;
      var wait = setInterval(function() {
        tries++;
        if (asapWeb.asap && asapWeb.context && asapWeb.processor) {
          clearInterval(wait);

          // Envia subsongs ao gadget
          try {
            var info  = asapWeb.asap.getInfo();
            var songs = info.getSongs();
            var durs  = [];
            for (var i = 0; i < songs; i++) durs.push(info.getDuration(i));
            window.parent.postMessage({
              type: 'subsongs', count: songs,
              defaultSong: info.getDefaultSong(), durations: durs
            }, '*');
          } catch(e) {}

          // Reinicia com duração calculada por loopCount
          var durMs = calcDuration(currentSong);
          try { asapWeb.asap.playSong(currentSong, durMs); } catch(e) {}

          hookAnalyser();
          startVisTimer();
          startPoller();

          try { window.parent.postMessage({ type: 'ready' }, '*'); } catch(e) {}

          // Envia vozes POKEY ao gadget
          try {
            var info = asapWeb.asap.getInfo();
            var channels = info.getChannels ? info.getChannels() : 1;
            var numVoices = channels === 2 ? 8 : 4;
            var names = [];
            for (var i = 0; i < numVoices; i++) names.push('Ch ' + (i+1));
            var mask = [];
            for (var i = 0; i < numVoices; i++) mask.push(true);
            window.parent.postMessage({
              type: 'voices', names: names, mask: mask,
              groups: [{ name: 'POKEY', voices: names.map(function(n,i){ return {idx:i,name:n}; }) }]
            }, '*');
          } catch(e) { console.log('Erro voices:', e); }
        } else if (tries > 50) {
          clearInterval(wait);
          setStatus('Timeout.', 'error');
        }
      }, 100);
    }

    window.addEventListener('message', function(ev) {
      if (!ev.data) return;
      var d = ev.data;

      if (d.type === 'play' && d.url) {
        songUrl = d.url; loopCount = d.loopCount || 1; currentSong = d.song || 0;
        startPlay();
      }
      if (d.type === 'voicemask' && d.mask) {
        try {
          // Converte array boolean para bitmask — bit 0 = canal 0, etc.
          // ASAP: bit=0 significa MUTED, bit=1 significa ATIVO
          var bitmask = 0;
          for (var i = 0; i < d.mask.length; i++) {
            if (d.mask[i]) bitmask |= (1 << i);
          }
          asapWeb.asap.mutePokeyChannels(~bitmask & 0xFF);
        } catch(e) {}
      }
      if (d.type === 'volume' && typeof d.level === 'number') {
        volLevel = Math.max(0, d.level);
        if (gainNode) gainNode.gain.value = volLevel;
      }
      if (d.type === 'pause') {
        try { if (asapWeb.context && asapWeb.context.state === 'running') asapWeb.context.suspend(); } catch(e) {}
      }
      if (d.type === 'resume') {
        try { if (asapWeb.context && asapWeb.context.state === 'suspended') asapWeb.context.resume(); } catch(e) {}
      }
      if (d.type === 'fadeout') {
        doFadeOut();
      }
      if (d.type === 'seek' && typeof d.ms === 'number') {
        try { asapWeb.seek(d.ms); } catch(e) {}
      }
      if (d.type === 'subsong' && typeof d.index === 'number') {
        currentSong = d.index;
        var durMs = calcDuration(currentSong);
        try {
          if (asapWeb.context && asapWeb.context.state === 'suspended') asapWeb.context.resume();
          // Restaura onaudioprocess original antes de tocar nova faixa
          if (asapWeb.processor && _origOAP) {
            asapWeb.processor.onaudioprocess = _origOAP;
          }
          asapWeb.asap.playSong(currentSong, durMs);
          startPoller(2000);
          var n = songUrl.split('/').pop().replace(/\.[^.]+$/, '');
          try { n = decodeURIComponent(n); } catch(e) {}
          setStatus('\u266A ' + n + ' [' + (currentSong + 1) + ']', 'playing');
        } catch(e) { setStatus('Erro subsong', 'error'); }
      }
      if (d.type === 'setloop' && typeof d.count === 'number') {
        loopCount = d.count;
        if (asapWeb.asap) {
          try { asapWeb.asap.playSong(currentSong, calcDuration(currentSong)); } catch(e) {}
        }
      }
    });

    if (songUrl) startPlay();
    else setStatus('Pronto.', '');
  </script>
</body>
</html>
